[project]
name = "regime-aware-asset-allocation"
version = "0.1.0"
description = "Regime-aware volatility forecasting and dynamic asset allocation: evidence from U.S. financial markets"
authors = [{ name = "Shakhrukh Kakhramonov" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "arch>=7.0",
    "hmmlearn>=0.3",
    "scikit-learn>=1.5",
    "yfinance>=0.2",
    "pandas-datareader>=0.10",
    "matplotlib>=3.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyterlab>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
